<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مملكة الأشقر | برنامج المراسلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ======================= شاشة الدخول / التسجيل ======================= -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">👑</div>
      <h1>مملكة الأشقر</h1>
      <p>تواصل فردي وجماعي، فوري ومباشر</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">دخول</button>
      <button class="auth-tab" data-tab="register">حساب جديد</button>
    </div>

    <form id="loginForm" class="auth-form">
      <input type="text" id="loginUsername" placeholder="اسم المستخدم" required autocomplete="username">
      <div class="password-field">
        <input type="password" id="loginPassword" placeholder="كلمة المرور" required autocomplete="current-password">
        <button type="button" class="eye-toggle" data-target="loginPassword">👁</button>
      </div>
      <button type="submit" class="btn-primary">دخول</button>
      <p class="auth-error" id="loginError"></p>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <input type="text" id="regDisplayName" placeholder="اسمك الكامل" required>
      <input type="text" id="regUsername" placeholder="اسم المستخدم" required autocomplete="username">
      <div class="password-field">
        <input type="password" id="regPassword" placeholder="كلمة المرور" required autocomplete="new-password">
        <button type="button" class="eye-toggle" data-target="regPassword">👁</button>
      </div>
      <button type="submit" class="btn-primary">إنشاء الحساب</button>
      <p class="auth-error" id="regError"></p>
    </form>
  </div>
</div>

<!-- ======================= واجهة التطبيق ======================= -->
<div id="appScreen" class="app-shell hidden">

  <!-- ------- الشريط الجانبي ------- -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <button id="openProfileBtn" class="avatar-btn">
        <img id="myAvatar" class="avatar avatar-md" src="/img/default-avatar.svg" alt="">
      </button>
      <div class="me-info">
        <div id="myName" class="me-name">—</div>
        <div id="myIdBadge" class="me-id">ID: —</div>
      </div>
      <button id="newGroupBtn" class="icon-btn" title="محادثة جماعية جديدة">👥</button>
      <button id="logoutBtn" class="icon-btn" title="تسجيل الخروج">⎋</button>
    </div>

    <div class="search-box">
      <input type="text" id="idSearchInput" placeholder="ابحث عن صديقك بالآيدي">
      <button id="idSearchBtn" class="btn-small">بحث</button>
    </div>
    <div id="searchResult" class="search-result hidden"></div>

    <div class="sidebar-tabs">
      <button class="side-tab active" data-side-tab="chats">المحادثات</button>
      <button class="side-tab" data-side-tab="friends">الأصدقاء</button>
    </div>

    <div id="chatList" class="list-scroll"></div>
    <div id="friendsTab" class="list-scroll hidden">
      <div id="requestsSection" class="hidden">
        <div class="section-label">طلبات الصداقة</div>
        <div id="requestsList"></div>
      </div>
      <div class="section-label">الأصدقاء</div>
      <div id="friendList"></div>
    </div>
  </aside>

  <!-- ------- منطقة المحادثة ------- -->
  <main class="chat-area">
    <div id="emptyState" class="empty-state">
      <div class="empty-mark">👑</div>
      <p>اختر محادثة من القائمة أو ابحث عن صديق للبدء</p>
    </div>

    <div id="chatWindow" class="chat-window hidden">
      <header class="chat-header">
        <div class="chat-header-left">
          <button id="chatSettingsBtn" class="icon-btn small" title="إعدادات المحادثة">⚙</button>
          <div id="settingsPanel" class="settings-panel hidden">
            <button id="muteToggleBtn" class="settings-item">🔕 كتم الإشعارات</button>
            <label class="settings-item settings-file-label">
              🖼 تغيير خلفية المحادثة
              <input type="file" id="bgFileInput" accept="image/*" hidden>
            </label>
            <button id="removeBgBtn" class="settings-item">↩ إزالة الخلفية</button>
          </div>
        </div>
        <div class="chat-header-info">
          <div class="chat-header-title" id="chatTitle">—</div>
          <div class="chat-header-sub" id="chatSub"></div>
        </div>
        <img id="chatAvatar" class="avatar avatar-md" src="/img/default-avatar.svg" alt="">
      </header>

      <div id="messagesEl" class="messages"></div>

      <form id="composerForm" class="composer">
        <label class="icon-btn attach-btn" title="إرسال صورة أو فيديو">
          📎
          <input type="file" id="mediaInput" accept="image/*,video/*" hidden>
        </label>
        <input type="text" id="messageInput" placeholder="اكتب رسالتك..." autocomplete="off">
        <button type="submit" class="icon-btn send-btn" title="إرسال">➤</button>
      </form>
    </div>
  </main>
</div>

<!-- ======================= نافذة الملف الشخصي ======================= -->
<div id="profileModal" class="modal-overlay hidden">
  <div class="modal">
    <h2>ملفي الشخصي</h2>
    <div class="profile-edit">
      <label class="avatar-upload">
        <img id="profileAvatarPreview" class="avatar avatar-lg" src="/img/default-avatar.svg" alt="">
        <span>تغيير الصورة</span>
        <input type="file" id="profileAvatarInput" accept="image/*" hidden>
      </label>
      <input type="text" id="profileDisplayName" placeholder="اسمك">
      <div class="my-id-line">آيدي المستخدم الخاص بك: <b id="profileIdText">—</b></div>
    </div>
    <div class="modal-actions">
      <button id="saveProfileBtn" class="btn-primary">حفظ</button>
      <button class="btn-secondary modal-close">إلغاء</button>
    </div>
  </div>
</div>

<!-- ======================= نافذة إنشاء محادثة جماعية ======================= -->
<div id="groupModal" class="modal-overlay hidden">
  <div class="modal">
    <h2>محادثة جماعية جديدة</h2>
    <input type="text" id="groupNameInput" placeholder="اسم الكروب">
    <div id="groupMembersList" class="group-members-list"></div>
    <div class="modal-actions">
      <button id="createGroupBtn" class="btn-primary">إنشاء</button>
      <button class="btn-secondary modal-close">إلغاء</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/client.js"></script>
</body>
</html>
